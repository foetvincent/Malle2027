"><h2><span data-ic=\"user\"><\/span>Deine Daten<\/h2>\n<label>Geschlecht<\/label>\n<div class=\"seg\" id=\"sexseg\"><button class=\"on\" data-v=\"0.7\">Mann<\/button><button data-v=\"0.6\">Frau<\/button><\/div>\n<div class=\"row\"><div><label>Gewicht (kg)<\/label><input id=\"w\" type=\"number\" inputmode=\"decimal\" value=\"80\" min=\"30\" max=\"250\"><\/div>\n<div><label>Start (erstes Getränk)<\/label><input id=\"start\" type=\"time\" value=\"20:00\"><\/div><\/div>\n<div class=\"row\"><div><label>Jetzt-Uhrzeit<\/label><input id=\"now\" type=\"time\"><\/div><div><\/div><\/div>\n<\/div>\n\n<div class=\"card\"><h2><span data-ic=\"chart\"><\/span>Ergebnis<\/h2>\n<div class=\"hero\">\n<div class=\"bacbig\"><div class=\"n\" id=\"bac\">0,00 ‰<\/div><div class=\"pill\" id=\"status\"><\/div><\/div>\n<div class=\"gauge\"><svg viewBox=\"0 0 200 200\"><circle class=\"trk\" cx=\"100\" cy=\"100\" r=\"86\"/><circle class=\"val\" id=\"ring\" cx=\"100\" cy=\"100\" r=\"86\" stroke-dasharray=\"540.4\" stroke-dashoffset=\"540.4\"/><\/svg>\n<div class=\"mid\"><b id=\"safeBig\">0%<\/b><span>Liedtext-<br>sicherheit<\/span><\/div><\/div><\/div>\n<div class=\"stats\"><div class=\"stat\"><small>Alkohol<\/small><b id=\"gr\">0 g<\/b><\/div><div class=\"stat\"><small>Unter 0,5 ‰ ab<\/small><b id=\"drive\">–<\/b><\/div><div class=\"stat\"><small>Nüchtern ab<\/small><b id=\"sober\">–<\/b><\/div><\/div>\n<\/div>\n<div class=\"card info\" id=\"infoc\"><b>Promille:<\/b> Widmark-Formel: Alkohol (g) × 0,9 ÷ (Gewicht × r), r = 0,7 (Mann) / 0,6 (Frau), 10 % Resorptionsdefizit, Abbau 0,1 ‰ pro Stunde ab dem ersten Getränk. <b>Liedtextsicherheit:<\/b> ab dem ersten Getränk linear, nach 5 Stunden 100 %. Mix-Getränke sind Durchschnittswerte – Malle-Gläser sind oft stärker eingeschenkt. Nur Schätzung – nach Alkohol nicht fahren.<\/div>\n<\/section>\n\n<section id=\"menu\" class=\"tab\">\n<div class=\"card\"><h2><span data-ic=\"glass\"><\/span>Getränkekarte<\/h2>\n<div class=\"sum\"><span class=\"pill\" id=\"total\">0 Getränke<\/span><span class=\"pill\" id=\"totalg\">0 g Alkohol<\/span><button class=\"btn\" onclick=\"resetAll()\"><span data-ic=\"trash\"><\/span>Zurücksetzen<\/button><\/div>\n<br><div class=\"searchw\"><span data-ic=\"search\"><\/span><input id=\"q\" placeholder=\"Getränk suchen …\" autocomplete=\"off\"><\/div>\n<div class=\"chips\" id=\"chips\"><\/div>\n<div id=\"list\"><\/div><\/div>\n<div class=\"card\"><h2><span data-ic=\"plus\"><\/span>Eigenes Getränk<\/h2>\n<div class=\"addrow\"><div class=\"nm2\"><label>Name<\/label><input id=\"cn\" placeholder=\"z. B. Hausmischung\"><\/div><div><label>Menge (ml)<\/label><input id=\"cm\" type=\"number\" inputmode=\"numeric\" value=\"300\" min=\"1\"><\/div><div><label>Vol.-%<\/label><input id=\"ca\" type=\"number\" inputmode=\"decimal\" value=\"8\" min=\"0\" max=\"96\" step=\"0.1\"><\/div><button class=\"btn pr\" onclick=\"addCustom()\">Hinzufügen<\/button><\/div><\/div>\n<\/section>\n\n<section id=\"board\" class=\"tab\">\n<div class=\"card\"><h2><span data-ic=\"trophy\"><\/span>Scoreboard<\/h2>\n<div class=\"me-row\"><div>Du bist: <b id=\"meName\">–<\/b><\/div><button class=\"btn\" onclick=\"openName(true)\"><span data-ic=\"pen\"><\/span>Name ändern<\/button><\/div>\n<div class=\"me-row\" style=\"margin-top:10px\"><span class=\"live off\" id=\"live\"><span class=\"dot\"><\/span><span id=\"liveTxt\">offline<\/span><\/span><span class=\"live\" id=\"cntTxt\"><\/span><\/div>\n<div class=\"seg\" id=\"shareseg\" style=\"margin-top:12px\"><button class=\"on\" data-s=\"1\">Ich bin dabei<\/button><button data-s=\"0\">Versteckt<\/button><\/div>\n<\/div>\n<div class=\"card\"><div class=\"chips\" id=\"modechips\"><button class=\"chip on\" data-m=\"drinks\">Getränke<\/button><button class=\"chip\" data-m=\"bac\">Promille<\/button><button class=\"chip\" data-m=\"lyric\">Liedtextsicherheit<\/button><\/div>\n<div id=\"warnbox\"><\/div><div id=\"rank\"><\/div>\n<div class=\"info\" style=\"margin-top:10px\">Das Scoreboard aktua .textContent=!DB_URL?'nicht verbunden':v?'live':'offline'}\nfunction apply(path,data,merge){\nif(path==='/'){board=merge?Object.assign(board,data||{}):(data||{})}\nelse{const p=path.split('/').filter(Boolean);const id=p[0];\nif(p.length===1){if(data===null)delete board[id];else board[id]=merge?Object.assign(board[id]||{},data):data}\nelse{board[id]=board[id]||{};board[id][p[1]]=data}}\nrenderBoard()}\nlet es=null;\nfunction connect(){if(!DB_URL||!window.EventSource)return;\ntry{es=new EventSource(`${DB_URL}/scores.json`);\nes.addEventListener('put',e=>{try{const d=JSON.parse(e.data);apply(d.path,d.data,false)}catch(x){}});\nes.addEventListener('patch',e=>{try{const d=JSON.parse(e.data);apply(d.path,d.data,true)}catch(x){}});\nes.onopen=()=>setConn(true);es.onerror=()=>setConn(false)}catch(e){setConn(false)}}\nfunction poll(){if(!DB_URL)return;fetch(`${DB_URL}/scores.json`).then(r=>r.json()).then(d=>{board=d||{};setConn(true);renderBoard()}).catch(()=>setConn(false))}\nconst num=x=>{x=Number(x);return isFinite(x)?x:0};\nfunction calcEntry(e){const g=num(e.g),W=num(e.W),drinks=num(e.drinks);let bac=0,lyric=0;\nif(g>0&&e.t0){const h=Math.max(0,(Date.now()-num(e.t0))/3600000);bac=Math.max(0,W*Math.min(1,h/ABS_H)-RATE*h);lyric=Math.min(100,h/SAFE_H*100)}\nreturn {name:String(e.name||'?').slice(0,20),drinks,bac,lyric}}\nfunction renderBoard(){\nif(!$('board').classList.contains('on'))return;\nupdateMe();setConn(conn);\nconst all={...board};delete all[U.id];\nconst list=[];Object.entries(all).forEach(([id,e])=>{if(!e||typeof e!=='object'||!e.name)return;if(Date.now()-num(e.ts)>36*3600e3)return;list.push({id,me:false,...calcEntry(e)})});\nif(U.name&&U.share)list.push({id:U.id,me:true,...calcEntry(myEntry())});\nlist.sort((a,b)=>b[mode]-a[mode]||a.name.localeCompare(b.name));\nconst mx=Math.max(...list.map(x=>x[mode]),0.0001);\nconst val=x=>mode==='drinks'?x.drinks+(x.drinks===1?' Getränk':' Getränke'):mode==='bac'?f(x.bac)+' ‰':Math.round(x.lyric)+' %';\n$('warnbox').innerH }\nconst endT=(m,tn)=>Math.max(m.tSoberR+1,SAFE_H+1,tn+1);\nfunction marker(x,a,H,tt){x.strokeStyle='rgba(255,255,255,.85)';x.setLineDash([4,4]);x.lineWidth=1.5;x.beginPath();x.moveTo(a.X(tt),a.pt);x.lineTo(a.X(tt),H-a.pb);x.stroke();x.setLineDash([])}\nfunction curve(x,a,pts,fn,col,fill){if(pts.length<2)return;const g=x.createLinearGradient(0,a.pt,0,a.Y(0));g.addColorStop(0,fill);g.addColorStop(1,'rgba(0,0,0,0)');\nx.beginPath();pts.forEach(([t,v],i)=>i?x.lineTo(a.X(t),a.Y(fn(v))):x.moveTo(a.X(t),a.Y(fn(v))));x.lineTo(a.X(pts[pts.length-1][0]),a.Y(0));x.lineTo(a.X(0),a.Y(0));x.closePath();x.fillStyle=g;x.fill();\nx.beginPath();pts.forEach(([t,v],i)=>i?x.lineTo(a.X(t),a.Y(fn(v))):x.moveTo(a.X(t),a.Y(fn(v))));x.strokeStyle=col;x.lineWidth=3;x.lineJoin='round';x.shadowColor=col;x.shadowBlur=12;x.stroke();x.shadowBlur=0}\nfunction drawSafe(m,s,tn,e){const c=setup($('cv1'));if(!c)return;const {x,W,H}=c;const end=endT(m,tn);\nconst a=axes(x,W,H,end,s,[0,25,50,75,100].map(v=>[v+'%',v/100]));\nconst N=240,lim=end*e,pts=[];for(let i=0;i<=N;i++){const t=end*i/N;if(t>lim)break;pts.push([t,lyricT(t,1)])}\ncurve(x,a,pts,v=>v/100,'#c084fc','rgba(192,132,252,.45)');\nconst tt=Math.min(tn,end);marker(x,a,H,tt);\nconst sv=lyricT(tt,1);x.fillStyle='#fff';x.beginPath();x.arc(a.X(tt),a.Y(sv/100),6,0,7);x.fill();\nx.font='bold 13px system-ui';const right=a.X(tt)>W-100;x.textAlign=right?'right':'left';x.fillText(Math.round(sv)+'% · '+hm(s+tt),a.X(tt)+(right?-10:10),a.Y(sv/100)-10);\n$('sfNote').textContent=`Um ${hm(s+tt)} sitzen ${Math.round(sv)} % der Malle-Lyrics. 100 % Liedtextsicherheit gibt es um ${hm(s+SAFE_H)} (${SAFE_H} Std. nach dem ersten Getränk).`}\nfunction drawBac(m,s,tn,e){const c=setup($('cv2'));if(!c)return;const {x,W,H}=c;const end=endT(m,tn);\nconst mx=Math.max(m.peak*1.15,.7);\nconst a=axes(x,W,H,end,s,[0,1,2,3,4].map(i=>[f(mx*i/4,1)+'‰',i/4]));\n[[.5,'#ff4d5e'],[.3,'#eab308']].forEach(([v,col])=>{x.strokeStyle=col;x.setLineDash([5,4]);x.beginPath();x.moveTo(a.pl,a.Y(v/mx));x.lineTo(W-a.pr,a.Y(v/mx));x.stroke();x.setLineDash([])});\nconst lim=end*e,N=240,pts=[];for(let i=0;i<=N;i++){const t=end*i/N;if(t>lim)break;pts.push([t,m.bac(t)])}\ncurve(x,a,pts,v=>v/mx,'#ffb020','rgba(255,176,32,.4)');\nconst tt=Math.min(tn,end);marker(x,a,H,tt);\nx.fillStyle='#fff';x.beginPath();x.arc(a.X(tt),a.Y(m.bac(tt)/mx),6,0,7);x.fill()}\n/* ---------- Smiley ---------- */\nlet moodCur=0,moodTgt=0,moodRaf=0;\nconst SM_CAP=['Entspannt','Gute Laune','Breites Grinsen','Lachanfall'];\nfunction drawMood(m){\n const s=clampN(m/.35,0,1),o=Math.pow(clampN((m-.3)/.7,0,1),.85),sq=clampN((m-.66)/.12,0,1),tr=clampN((m-.82)/.18,0,1);\n const hw=14+15*s+7*o,cy=80-6*s-4*o,cu=cy+1+13*s,cl=cu+3+46*o,x0=60-hw,x1=60+hw;\n const d=`M${x0.toFixed(1)} ${cy.toFixed(1)}Q60 ${cu.toFixed(1)} ${x1.toFixed(1)} ${cy.toFixed(1)}Q60 ${cl.toFixed(1)} ${x0.toFixed(1)} ${cy.toFixed(1)}Z`;\n $('smMouth').setAttribute('d',d);$('smclipP').setAttribute('d',d);\n const top=cy-2;$('smTeeth').setAttribute('y',top);$('smTeeth').setAttribute('height',(o>.12?8+7*o:0).toFixed(1));\n const bot=cy+(cl-cy)/2;$('smTongue').setAttribute('cy',(bot-1).toFixed(1));$('smTongue').setAttribute('ry',(o>.35?9*o:0).toFixed(1));$('smTongue').setAttribute('rx',(hw*.55).toFixed(1));\n ['smEL','smER'].forEach(i=>$(i).parentNode.style.opacity=1-sq);['smAL','smAR'].forEach(i=>$(i).setAttribute('opacity',sq));\n $('smBrows').setAttribute('transform','translate(0 '+(-5*m).toFixed(1)+')');\n $('smCL').setAttribute('opacity',(.55*clampN(m*1.6,0,1)).toFixed(2));$('smCR').setAttribute('opacity',(.55*clampN(m*1.6,0,1)).toFixed(2));\n $('smTears').style.opacity=tr;\n const lv=m<.08?0:m<.3?1:m<.6?2:3,sm=$('smiley');\n if(sm.dataset.lv!==String(lv)){sm.dataset.lv=lv;$('smCap').textContent=SM_CAP[lv]}}\nfunction moodStep(){const d=moodTgt-moodCur;if(Math.abs(d)<.002){moodCur=moodTgt;drawMood(moodCur);moodRaf=0;return}\n moodCur+=d*.08;drawMood(moodCur);moodRaf=requestAnimationFrame(moodStep)}\nfunction setMood(b){moodTgt= nif(!U.name)openName(false);\ncalc();connect();poll();if(U.name)pushScore();\n<\/script><\/body><\/html>"</script>

(function(){

$('lkTitle').textContent=TITLE;

 if(done)return;

 if(ms<0)ms=0;
 const total=Math.floor(ms/1000);
 const d=Math.floor(total/86400),h=Math.floor(total%86400/3600),m=Math.floor(total%3600/60),sec=total%60;
 if(SHOW_DAYS)put([d,h,m,sec]);else put([0,h+d*24,m,sec]);
